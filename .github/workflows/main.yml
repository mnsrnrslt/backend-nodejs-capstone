name: 'CI/CD'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run Linter
        run: |
          find ./secondChance-backend -name "*.js" -not -path "*/node_modules/*" -exec jshint {} +
          find ./sentiment -name "*.js" -not -path "*/node_modules/*" -exec jshint {} +
          echo "Linted all the js files successfully"

  client_build:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build
        run: |
          cd giftlink-frontend
          npm install
          CI=false npm run build
          echo "Client-side build successfully"
